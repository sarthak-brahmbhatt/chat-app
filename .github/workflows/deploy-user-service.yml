name: Deploy user-service

# Runs on every merge to main that touches user-service/ - path-filtered so a
# chat-service-only or frontend-only commit never rebuilds/redeploys this
# service. See deploy-chat-service.yml for the equivalent, deliberately
# SEPARATE workflow for that service.
on:
  push:
    branches: [main]
    paths:
      - 'user-service/**'
      - '.github/workflows/deploy-user-service.yml'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: 786566430552.dkr.ecr.us-east-1.amazonaws.com/chat-app/user-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # CLAUDE.md 3.8: the manually-created, scoped-down chat-app-deploy
          # IAM user's access keys. Same secret names as deploy-frontend.yml -
          # one IAM user, one pair of secrets, reused by every deploy
          # workflow in this repo rather than minting a new pair per
          # workflow for no reason.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Pushes TWO tags of the same build, and they serve different jobs:
      #   :latest    - a floating pointer. This is what
      #                cloudformation/chat-app-stack.yaml's
      #                UserServiceImageTag parameter DEFAULTS to, so it's
      #                what a fresh stack create (before this pipeline has
      #                ever run) pulls. Convenient for manual `docker pull
      #                ...:latest` debugging too.
      #   :$sha_short - immutable. This is the tag the stack update below
      #                actually sets UserServiceImageTag to, specifically
      #                so a LATER unrelated push overwriting :latest can
      #                never change what THIS deploy put into service.
      #                Rollback means re-running the stack update with an
      #                OLDER already-pushed SHA tag - only possible because
      #                this tag exists and stays addressable after `latest`
      #                moves on.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REPO }}:latest
            ${{ env.ECR_REPO }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=user-service
          cache-to: type=gha,mode=max,scope=user-service

      # CloudFormation is the ONLY thing that creates or replaces
      # UserServiceInstance now - see CLAUDE.md 3.8 for the full mechanics
      # and why this replaced an earlier ec2:RunInstances-based approach.
      # In short: UserServiceInstance's LaunchTemplate.Version is wired to
      # !GetAtt UserServiceLaunchTemplate.LatestVersionNumber, so bumping
      # UserServiceImageTag here is enough on its own - CloudFormation
      # creates a new Launch Template version, detects the instance's own
      # Version property changed as a result, and replaces the instance as
      # part of the SAME update. No direct EC2/ELB API calls needed here at
      # all: no run-instances, no register/deregister-targets, no manual
      # instance lookup (and therefore no way for this workflow to leave
      # behind an orphan CloudFormation doesn't know about, which is
      # exactly the failure mode this replaced).
      #
      # UsePreviousValue for every OTHER parameter is what makes this safe:
      # without it, an update-stack call that only specifies
      # UserServiceImageTag would reset every unlisted parameter to the
      # TEMPLATE's default - silently wiping MysqlRootPassword/JwtSecret
      # back to empty, the exact bug that took the whole stack down before.
      # The parameter KEYS are fetched from the live stack rather than
      # hardcoded here, so this can't drift out of sync if the template's
      # Parameters section ever changes.
      - name: Update CloudFormation stack with new image tag
        run: |
          set -euo pipefail
          NEW_TAG="${{ steps.vars.outputs.sha_short }}"
          PARAMS_FILE="$(mktemp)"

          KEYS=$(aws cloudformation describe-stacks \
            --region "${{ env.AWS_REGION }}" --stack-name chat-app \
            --query 'Stacks[0].Parameters[].ParameterKey' --output text | tr '\t' '\n')

          # -R (raw input, one line per input) + -n (don't auto-read the
          # first line into `.`, let `inputs` consume the whole stream
          # instead) turns the plain KEYS list into exactly one JSON object
          # per parameter - UserServiceImageTag gets the new tag,
          # everything else gets UsePreviousValue so this update can't
          # silently reset any other parameter (MysqlRootPassword,
          # JwtSecret, ...) to its template default.
          echo "$KEYS" | jq -R -n --arg tag "$NEW_TAG" '
            [inputs | select(length > 0) |
              if . == "UserServiceImageTag"
              then {ParameterKey: ., ParameterValue: $tag}
              else {ParameterKey: ., UsePreviousValue: true}
              end]' > "$PARAMS_FILE"

          ./cloudformation/deploy.sh deploy chat-app cloudformation/chat-app-stack.yaml \
            --parameters "file://${PARAMS_FILE}"

          rm -f "$PARAMS_FILE"
