spring:
  application:
    name: user-service

  # --- MySQL connection: chatappdb (CLAUDE.md 3.5) ---
  #
  # Was `userdb` until build-order step 18 consolidated userdb + messagedb into a
  # single `chatappdb`. Nothing about user-service's own tables changed — it still
  # owns `users` and is still the only service that writes to it. What changed is
  # that chat-service now READS `users` out of this same database (to spot a
  # user_type = BOT recipient), which the old split made impossible in SQL. See
  # mysql-init/01-init-databases.sql for the reasoning and the tradeoff accepted.
  #
  # Every value below uses Spring's ${VAR_NAME:default} property placeholder syntax:
  # if the environment variable VAR_NAME is set, its value wins; otherwise the text
  # after the colon is used. This single file works unmodified in both run contexts
  # required by this migration, because nothing here is hardcoded per-environment:
  #
  #   - IntelliJ (run directly, outside Docker): none of MYSQL_HOST/MYSQL_PORT/etc.
  #     are set in that process's environment, so every default kicks in ->
  #     localhost:3306, which is exactly the host port docker-compose.yml publishes
  #     MySQL on (see docker-compose.yml's "3306:3306" mapping). This assumes
  #     `docker compose up` is already running for the mysql/redis containers, per
  #     the task requirement.
  #   - Docker container (via `docker compose up`): docker-compose.yml sets
  #     MYSQL_HOST=mysql as a real environment variable on the user-service
  #     container, which overrides the default. "mysql" resolves via Docker's
  #     internal DNS to the mysql container, only reachable from inside the
  #     same Compose network.
  #
  # This is the standard Spring Boot approach for environment-specific config —
  # env-var-backed placeholders with sane local defaults — rather than maintaining
  # a second application-docker.yml / Spring profile, since there's nothing else
  # about the config that differs between the two contexts.
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/chatappdb
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  jpa:
    hibernate:
      # Lets Hibernate create/alter tables from @Entity classes automatically at
      # startup. Fine while there's no schema yet and we're iterating locally; once
      # real data matters, this should be replaced with versioned migrations
      # (Flyway/Liquibase) instead of letting Hibernate own schema changes.
      ddl-auto: update
    # Explicitly disables the "Open Session In View" pattern (Hibernate session kept
    # open for the whole HTTP request). It's Spring Boot's default, but leaving it
    # implicit prints a startup warning; we don't need lazy-loading-in-templates
    # since this is a pure REST API, so disabling it is also the more correct choice.
    open-in-view: false

  # --- Redis connection: refresh-token revocation registry (CLAUDE.md 3.3/3.7) ---
  # Same ${VAR:default} pattern as above, and for the same reason: no env var set
  # (IntelliJ) -> localhost:6379, the host port docker-compose.yml publishes Redis
  # on; REDIS_HOST=redis set by docker-compose.yml (containerized run) -> the redis
  # container's service name on the Docker network.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# --- JWT signing secret + access token lifetime (CLAUDE.md 3.3, build-order step 3) ---
# Same ${VAR:default} externalized-config pattern as the MySQL/Redis settings above,
# but for a different reason. Those needed genuinely different values per run
# context (container hostname vs localhost). This secret does NOT need to differ
# between Docker and IntelliJ — nothing about it is environment-topology-dependent,
# so it deliberately isn't overridden in docker-compose.yml the way MYSQL_HOST/
# REDIS_HOST are. The point of externalizing it isn't "differs per environment,"
# it's "never hardcode a signing secret in source control" — the default below is
# obviously a local-dev-only placeholder, so a real deployment is forced to set
# JWT_SECRET explicitly rather than silently inheriting a secret sitting in git
# history. Must be at least 32 bytes (256 bits) for HMAC-SHA256 — see JwtService.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-change-me-before-any-real-deployment}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}

# --- Refresh token lifetime (CLAUDE.md 3.3, build-order step 10) ---
# A separate top-level key from `jwt:` above, deliberately: the refresh token
# itself is NOT a JWT (see RefreshTokenService for why — an opaque random
# value checked against Redis, not a signed/self-contained token), so nesting
# it under `jwt:` would misleadingly imply otherwise. 7 days: long enough that
# an actively-used internal tool doesn't force a fresh login every day, short
# enough to bound how long a stolen refresh token stays useful — a deliberate
# middle ground for a ~10,000-employee internal tool, not a public consumer
# app where 30+ day silent sessions are common for retention reasons.
refresh-token:
  expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}

# --- The seeded DoctorAssistant bot user (CLAUDE.md 3.9, build-order step 18) ---
# user-service OWNS the `users` table, so it is the service that creates the bot's
# row (BotUserSeeder) — it already has the PasswordEncoder needed to bcrypt the
# unusable random password that NOT NULL column demands. chat-service only ever
# READS this row. The username lives in config in BOTH services rather than as a
# constant in each, so the two can't silently drift; a mismatch would present as
# "the bot never answers" with nothing pointing at the real cause.
bot:
  username: ${BOT_USERNAME:doctorassistant}
  display-name: ${BOT_DISPLAY_NAME:DoctorAssistant}
  # The Version 2 tool-calling bot — a SECOND seeded user, not a replacement.
  # Both appear in the user list so the two approaches can be demoed side by
  # side against the same clinic data.
  tool-username: ${BOT_TOOL_USERNAME:doctorassistant-tools}
  tool-display-name: ${BOT_TOOL_DISPLAY_NAME:DoctorAssistant (Tools)}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Only "health" is exposed (not the full actuator surface like /env or
        # /beans) — this is an internal tool, but there's still no reason to expose
        # more than what's needed to verify liveness/connectivity.
        include: health
  endpoint:
    health:
      # Without this, /actuator/health only returns a single top-level UP/DOWN.
      # "always" breaks it down per component (db, redis, diskSpace, ...), which is
      # exactly what lets us confirm MySQL and Redis are individually reachable —
      # the verification step for this migration — rather than just "the JVM booted".
      # Worth revisiting (e.g. restricting to authenticated/internal callers) once
      # this moves past the local learning phase, since health details can leak
      # internal topology.
      show-details: always
