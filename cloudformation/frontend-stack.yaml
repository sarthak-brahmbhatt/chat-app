AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  chat-app frontend (CLAUDE.md 3.8): private S3 bucket + CloudFront (Origin
  Access Control, no public bucket policy), now aliased to
  sarthak-chat-app.beer + www.sarthak-chat-app.beer via a us-east-1 ACM
  cert. Deliberately separate from chat-app-stack.yaml - see the comment
  block below for why.

# =============================================================================
# Why this is a SEPARATE stack from chat-app-stack.yaml (the backend): that
# stack is meant to be created/deleted per session (CLAUDE.md 3.8's cost
# posture - an ALB bills hourly whether or not it's used). This one costs
# close to nothing while idle (a few static files in S3 + CloudFront's free
# tier easily covers light traffic) and is meant to be deployed ONCE and
# left running, updated in place by the GitHub Actions workflow on every
# merge rather than torn down and recreated alongside the backend.
#
# RESOLVED (was a TODO here): Angular's production build targets the real
# backend via frontend/src/environments/environment.production.ts, swapped
# in by angular.json's fileReplacements. It points at
# api.sarthak-chat-app.beer (https for the API, wss for chat-service).
#
# RESOLVED (was a second TODO here): the distribution now presents
# sarthak-chat-app.beer and www.sarthak-chat-app.beer as Aliases, backed by
# a us-east-1 ACM cert covering both names as SANs on one certificate (see
# the AcmCertificateArn parameter below - a DIFFERENT certificate from
# chat-app-stack.yaml's own AcmCertificateArn parameter, which covers only
# api.sarthak-chat-app.beer for the ALB; CloudFront and the ALB each
# terminate TLS independently and can't share one cert resource).
#
# STILL OUTSTANDING, and outside what CloudFormation can do: this stack
# only configures the AWS side. Porkbun's DNS - the ALIAS record on the
# root domain and the CNAME record on www, both currently pointed at
# Porkbun's own parking target (pixie.porkbun.com) - has to be repointed
# at this distribution's domain name (this stack's CloudFrontDomainName
# output) separately, by hand, in Porkbun's dashboard. Nothing in this
# repo can make that change; ownership of the DNS zone stays with Porkbun.
# =============================================================================

Parameters:

  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:786566430552:certificate/caf0ea5c-6352-476e-9c4a-e2cb217446c1
    Description: >-
      us-east-1 ACM certificate covering sarthak-chat-app.beer and
      www.sarthak-chat-app.beer as SANs on one certificate (CLAUDE.md 3.8).
      CloudFront requires a us-east-1 cert regardless of which region the
      rest of the stack is in - the same hard constraint chat-app-stack.yaml
      already documents for the ALB's cert, restated here because this is
      a genuinely SEPARATE certificate resource, not a shared one.

Resources:

  # ---------------------------------------------------------------------------
  # S3 BUCKET - private origin for CloudFront, not a public website bucket.
  # No BucketName property is set deliberately: S3 bucket names are globally
  # unique across ALL AWS accounts, not just this one, so letting
  # CloudFormation auto-generate one (from the stack name + logical ID +
  # a random suffix) avoids a name collision that a fixed, guessed name
  # could hit. The actual generated name is read back via this stack's
  # S3BucketName output instead of being predicted ahead of time.
  # ---------------------------------------------------------------------------

  FrontendBucket:
    Type: AWS::S3::Bucket
    # This bucket holds the live, deployed frontend - unlike the backend
    # stack's resources (meant to be deleted per session), accidentally
    # deleting this one would take the whole site down and lose whatever
    # was last synced to it. Retain means a stack DELETE leaves the bucket
    # (and its contents) behind rather than removing it - matches this
    # stack's "deploy once, leave running" framing in the Description above.
    DeletionPolicy: Retain
    Properties:
      # Blocks every form of public access at the bucket level - belt and
      # suspenders alongside simply never attaching a public-read bucket
      # policy. This is what "private S3 bucket" concretely means: even a
      # future accidental bucket policy change couldn't make objects
      # public while this is set.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ---------------------------------------------------------------------------
  # ORIGIN ACCESS CONTROL - what actually lets CloudFront read from a PRIVATE
  # bucket without the bucket needing a public-read policy. CloudFront signs
  # every request it makes to the S3 origin with SigV4 (the same request-
  # signing scheme the AWS CLI/SDKs use), and the bucket policy below only
  # trusts requests signed this way, from this specific distribution - not
  # from anyone else, and not from the bucket's own S3 URL directly. OAC is
  # the current (2022+) mechanism for this; it replaces the older "Origin
  # Access Identity" (OAI) approach, which is still around for legacy
  # distributions but is no longer the recommended path for a new one.
  # ---------------------------------------------------------------------------

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: chat-app-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------------------------------------------------------------------------
  # CLOUDFRONT DISTRIBUTION - now aliased to the real domain. The
  # distribution's own *.cloudfront.net domain (this stack's
  # CloudFrontDomainName output) keeps working regardless - Aliases ADDS
  # names CloudFront will accept, it doesn't remove the default one - which
  # is exactly why the GitHub Actions deploy workflow's invalidation step
  # and this stack's own S3BucketName/CloudFrontDistributionId outputs
  # needed no changes for this.
  # ---------------------------------------------------------------------------

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        # Both names the ACM certificate above covers as SANs. CloudFront
        # requires every value listed here to appear as a SAN on whatever
        # certificate ViewerCertificate references below - listing a name
        # here that the cert doesn't cover fails stack creation outright,
        # not silently.
        Aliases:
          - sarthak-chat-app.beer
          - www.sarthak-chat-app.beer
        # Cheapest price class - only US/Canada/Europe edge locations. A
        # reasonable default for a project whose whole AWS posture is
        # minimizing fixed/ongoing cost (same reasoning as skipping the
        # ALB and NAT Gateway elsewhere in CLAUDE.md 3.8) - broaden this if
        # global latency ever actually matters for real users.
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3Origin
            # RegionalDomainName (bucket-name.s3.REGION.amazonaws.com), not
            # the older global DomainName (bucket-name.s3.amazonaws.com) -
            # the regional form avoids an extra redirect CloudFront would
            # otherwise have to follow on every origin fetch.
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              # Deliberately empty: this field exists for the OLDER
              # Origin Access Identity mechanism. When using OAC (above)
              # instead, it's required to be present but blank - CloudFront
              # still needs to see an S3OriginConfig block to know this is
              # an S3 origin at all, it just isn't the thing doing the
              # actual access control anymore.
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # The AWS-managed "CachingOptimized" cache policy - a fixed,
          # global ID that's the same in every AWS account (it's an
          # AWS-owned managed policy, not something this account created),
          # so it's safe to reference directly rather than defining a
          # custom AWS::CloudFront::CachePolicy resource just to reinvent
          # what this one already does: cache based on nothing but the
          # request path (no cookies/query strings affecting the cache
          # key, which is exactly right for a static SPA build where the
          # same URL always means the same file).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # Angular's router handles paths like /chat or /login entirely
        # CLIENT-SIDE - there's no actual /chat object in the S3 bucket.
        # Without this rewrite, requesting /chat directly (e.g. a page
        # refresh, or sharing a deep link) would get a 403 from S3 (via
        # CloudFront - a private bucket returns 403, not 404, for a
        # missing key when the request is otherwise validly signed) with
        # no HTML at all, instead of loading index.html and letting
        # Angular's router take over. This is what actually makes
        # client-side routing work behind CloudFront - not optional
        # SPA-specific bonus, a hard requirement for a multi-route Angular
        # app.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          # sni-only, not the legacy `vip` option: vip provisions a
          # dedicated IP per distribution specifically for pre-SNI clients
          # (effectively nothing left in real traffic today) and CloudFront
          # bills for it; every modern browser supports SNI, so there's no
          # reason to pay for that. Same reasoning already applied to the
          # ALB's own TLS choice in chat-app-stack.yaml.
          SslSupportMethod: sni-only
          # CloudFront's own name for the same TLS 1.2-minimum security
          # baseline chat-app-stack.yaml's ALB listener uses
          # (ELBSecurityPolicy-TLS13-1-2-2021-06) - the two services name
          # their policies differently, but both land on: TLS 1.2 minimum,
          # no legacy protocol versions accepted.
          MinimumProtocolVersion: TLSv1.2_2021

  # ---------------------------------------------------------------------------
  # BUCKET POLICY - the other half of OAC: grants CloudFront's service
  # principal read access, but ONLY when the request comes from THIS
  # specific distribution (the AWS:SourceArn condition) - not from any
  # CloudFront distribution in any account. This is what keeps the bucket
  # genuinely private (no public-read statement anywhere) while still
  # letting the one distribution that's supposed to serve it actually do so.
  # Defined as a separate resource from the bucket (rather than inline
  # BucketPolicy content) because it needs to reference the distribution's
  # ARN, which doesn't exist yet at the point the bucket itself is defined
  # above - CloudFormation resolves this ordering automatically via the
  # !Sub reference to FrontendDistribution.Id below.
  # ---------------------------------------------------------------------------

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution.Id}'

Outputs:

  CloudFrontDomainName:
    Description: >-
      The site's live URL is https://<this value>/. Also needed by the
      GitHub Actions deploy workflow (as the invalidation target) via its
      distribution ID, see CloudFrontDistributionId below.
    Value: !GetAtt FrontendDistribution.DomainName

  S3BucketName:
    Description: >-
      Sync `ng build` output here (e.g. `aws s3 sync dist/frontend/browser
      s3://<this value> --delete`).
    Value: !Ref FrontendBucket

  CloudFrontDistributionId:
    Description: >-
      NOT explicitly requested as an output, but added deliberately: the
      GitHub Actions workflow this stack was built alongside needs this
      exact value to run `aws cloudfront create-invalidation
      --distribution-id <this value>` after every sync - without it,
      that step would have nothing to invalidate against except a manual
      console lookup on every deploy.
    Value: !GetAtt FrontendDistribution.Id
