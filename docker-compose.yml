# "x-" prefixed top-level keys are a Docker Compose "extension field" — Compose
# itself ignores this key entirely (it's not a real service/volume/etc.), which is
# exactly what makes it a safe place to define a YAML anchor (&jwt-secret) purely for
# reuse elsewhere in this same file via an alias (*jwt-secret). user-service (issues
# tokens) and chat-service (verifies them) both need this EXACT same value — see
# user-service/src/main/java/.../security/JwtService.java and
# chat-service/src/main/java/.../security/JwtValidator.java. Defining it once here
# and referencing it from both services' environment blocks means there is
# structurally one value, not two independently-typed-out strings that merely happen
# to match today. This only covers Docker Compose runs, though — see the jwt.secret
# comment in each service's application.yml for how native/IntelliJ runs (where this
# file isn't involved at all) have to keep their defaults in sync by hand instead.
x-jwt-secret: &jwt-secret dev-only-insecure-jwt-signing-secret-change-me-before-any-real-deployment

services:
  mysql:
    image: mysql:8.0
    container_name: chat-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat-app-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    container_name: chat-app-user-service
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Overrides the localhost defaults baked into user-service's application.yml
      # (spring.datasource.* / spring.data.redis.*). "mysql" and "redis" below are
      # not hostnames in the general internet sense — they're the service names from
      # this same docker-compose.yml, which Docker's embedded DNS resolves to the
      # right container IP, but ONLY for other containers on this Compose network.
      # That's why these values would be wrong (connection refused) if used from
      # IntelliJ running outside Docker — there, the same variables are simply unset
      # and application.yml's ${...:localhost} defaults take over instead.
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: *jwt-secret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-service:
    build: ./chat-service
    container_name: chat-app-chat-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      # No MySQL/Redis host wiring needed here (see chat-service/build.gradle) — this
      # service currently has exactly one cross-cutting config need, verifying JWTs
      # issued by user-service, which is why this is the only environment entry.
      JWT_SECRET: *jwt-secret

volumes:
  mysql-data:
