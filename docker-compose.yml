# "x-" prefixed top-level keys are a Docker Compose "extension field" — Compose
# itself ignores this key entirely (it's not a real service/volume/etc.), which is
# exactly what makes it a safe place to define a YAML anchor (&jwt-secret) purely for
# reuse elsewhere in this same file via an alias (*jwt-secret). user-service (issues
# tokens) and chat-service (verifies them) both need this EXACT same value — see
# user-service/src/main/java/.../security/JwtService.java and
# chat-service/src/main/java/.../security/JwtValidator.java. Defining it once here
# and referencing it from both services' environment blocks means there is
# structurally one value, not two independently-typed-out strings that merely happen
# to match today. This only covers Docker Compose runs, though — see the jwt.secret
# comment in each service's application.yml for how native/IntelliJ runs (where this
# file isn't involved at all) have to keep their defaults in sync by hand instead.
x-jwt-secret: &jwt-secret dev-only-insecure-jwt-signing-secret-change-me-before-any-real-deployment

services:
  mysql:
    image: mysql:8.0
    container_name: chat-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat-app-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: chat-app-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # --- KRaft mode: why there's no separate ZooKeeper container ---
      # Older Kafka used a separate ZooKeeper cluster purely to elect a
      # "controller" broker and store cluster metadata (which topics/
      # partitions exist, who's leader for each, etc.). KRaft (Kafka Raft)
      # replaces that entire job with a Raft consensus protocol built
      # directly into Kafka itself — the same process can now play BOTH the
      # broker role (handling actual produce/consume traffic) and the
      # controller role (the old ZooKeeper job) at once. That dual role is
      # exactly what KAFKA_PROCESS_ROLES: 'broker,controller' below turns on,
      # and it's why this single container replaces what used to be two.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      # This node names itself as the one and only voter in its own
      # controller quorum — correct for a single-node dev cluster; a real
      # multi-node production cluster would list several nodes here so the
      # controller role survives any one of them going down.
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      # Three listeners this broker accepts connections on: CONTROLLER
      # carries KRaft's own internal consensus traffic (never used by our
      # application code directly); PLAINTEXT is for OTHER CONTAINERS on
      # this Compose network (chat-service, when containerized — reaches
      # this broker via the service name "kafka"); PLAINTEXT_HOST is for
      # anything OUTSIDE Docker (a natively-run chat-service, or you
      # inspecting a topic from your own machine).
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      # The address a client is actually TOLD to use for every request after
      # its first connection — this is the setting that trips people up: you
      # connect to whatever KAFKA_LISTENERS exposes, but Kafka immediately
      # hands back THIS value as "the real address for everything from here
      # on," so if it's wrong, the connection silently breaks on the second
      # request, not the first. Same dual-mode reasoning as MySQL/Redis's
      # ${VAR:localhost} pattern elsewhere in this file: a containerized
      # chat-service is told "kafka:19092" (Docker's internal DNS), a
      # natively-run one is told "localhost:9092" (the published host port).
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Which listener brokers use to talk to EACH OTHER — meaningless with
      # only one broker, but Kafka requires it to be set regardless.
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      # A fixed cluster ID (any valid-looking base64 string; this one has no
      # special meaning) rather than a randomly generated one, so this
      # cluster's identity is reproducible across `docker compose down`/`up`
      # cycles instead of silently becoming a "new" cluster each time.
      CLUSTER_ID: 'ciWo7IWazngRchmPES6q5A=='
      # Every *_REPLICATION_FACTOR / *_MIN_ISR setting below governs one of
      # Kafka's own INTERNAL bookkeeping topics (consumer offsets,
      # transaction state, etc.), all forced down to 1 because we only have
      # ONE broker — a replication factor higher than the broker count makes
      # Kafka refuse to create that internal topic at all, and the broker
      # won't start cleanly. This is purely a "we only have one broker"
      # accommodation, not a statement about our own chat-messages topic
      # (see KafkaTopicConfig.java for that).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Skips Kafka's default artificial delay before the first consumer
      # group rebalance (normally there to let multiple consumers join
      # together before assigning partitions) — irrelevant with our single
      # consumer instance, and just slows down local dev/restarts for no
      # benefit here.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # A browser-based SQL client for chatappdb — schema, the rows the bot writes to
  # `appointments`, and the token cost accumulating in `bot_token_usage`, all a
  # plain SELECT away.
  #
  #     docker compose --profile tools up -d adminer
  #     http://localhost:8083   (System: MySQL, Server: mysql,
  #                              Username: root, Password: root, DB: chatappdb)
  #
  # Behind a PROFILE, so a plain `docker compose up` does not start it. Two
  # reasons. It is a debugging tool, not part of the application, and it has no
  # business in the stack whose connection capacity step 11 measures. And an
  # Adminer started by hand outside Compose is a common thing to have running
  # already — an unprofiled service here would collide with it on the container
  # name and break `up` outright, which is a poor trade for a convenience.
  #
  # Adminer rather than phpMyAdmin: one ~10MB PHP file versus a whole
  # application, and no configuration to speak of.
  #
  # DEV ONLY. Unauthenticated database access to anything that can reach the
  # port — fine on a laptop, which is why this exists here and in no
  # CloudFormation template.
  adminer:
    image: adminer:4
    container_name: chat-app-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      # Pre-fills the login form's server field so it is one less thing to
      # retype; "mysql" is this Compose network's DNS name for the database.
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

  user-service:
    build: ./user-service
    container_name: chat-app-user-service
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Overrides the localhost defaults baked into user-service's application.yml
      # (spring.datasource.* / spring.data.redis.*). "mysql" and "redis" below are
      # not hostnames in the general internet sense — they're the service names from
      # this same docker-compose.yml, which Docker's embedded DNS resolves to the
      # right container IP, but ONLY for other containers on this Compose network.
      # That's why these values would be wrong (connection refused) if used from
      # IntelliJ running outside Docker — there, the same variables are simply unset
      # and application.yml's ${...:localhost} defaults take over instead.
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: *jwt-secret
    # Exists so chat-service can WAIT for this service (see its depends_on below),
    # not for monitoring. user-service owns the `users` table: Hibernate's
    # ddl-auto:update creates it at startup here, and BotUserSeeder inserts the
    # BOT row right after. chat-service READS that table (chatappdb consolidation,
    # CLAUDE.md 3.5/3.9) and maps only a subset of its columns, so if chat-service
    # won the startup race it would create a PARTIAL `users` table and user-service
    # would then have to ALTER a NOT NULL `password` column onto it. Ordering the
    # two removes that hazard entirely rather than relying on it working out.
    #
    # BusyBox wget (present in the eclipse-temurin:21-jre-alpine runtime image);
    # there is no curl in that image.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-service:
    build: ./chat-service
    container_name: chat-app-chat-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    # Resource ceiling for build-order step 11's load test (CLAUDE.md 3.6/11.x):
    # without an explicit limit, chat-service can freely consume whatever Docker
    # Desktop's VM happens to have available, which makes "compare usage against
    # its Docker-imposed limit" meaningless — there'd be no limit to compare
    # against. 512m/1 cpu is a deliberately small, arbitrary-but-fixed ceiling
    # chosen to make a connection-count failure point observable without needing
    # thousands of simulated connections; it is NOT modeling any specific real
    # EC2 instance type. The JVM's container-aware ergonomics (on by default,
    # JDK 10+) caps default max heap at 25% of this limit automatically — no
    # explicit -Xmx needed for that. Thread stacks (the ~1MB-per-connection cost
    # CLAUDE.md 3.6 reasons about) are NOT heap; they draw from the same 512m
    # container ceiling but outside that 25% heap carve-out, via the JVM's
    # default ~1MB -Xss on Linux — again no override needed, the platform
    # default already matches the number the theoretical math used.
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    environment:
      JWT_SECRET: *jwt-secret
      # Same dual-mode reasoning as user-service's MYSQL_* block: these are
      # only real, resolvable hostnames from INSIDE this Compose network.
      # As of build-order step 18 chat-service uses chatappdb — the very same
      # DATABASE as user-service now, not just the same MySQL container as it
      # was at step 8 (see mysql-init/01-init-databases.sql for why the
      # userdb/messagedb split was reversed, and what it cost).
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      # "kafka:19092" is the PLAINTEXT listener above — the one meant for
      # other containers, not the PLAINTEXT_HOST one published to the host.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # --- DoctorAssistant bot (CLAUDE.md 3.9, build-order step 18) ---
      # Compose automatically reads a `.env` file sitting next to this one and
      # substitutes ${...} from it, which is the whole mechanism here: the real
      # key lives in that gitignored .env, never in this committed file (unlike
      # the deliberately fake dev JWT secret at the top). ":-" supplies an EMPTY
      # default so `docker compose up` still works with no .env present at all —
      # chat-service boots fine and the bot answers with a "not configured"
      # message instead of the container failing to start. See .env.example.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Not a runtime dependency — chat-service never calls user-service over HTTP
      # (CLAUDE.md 3.2's service boundary still holds). This is purely a SCHEMA
      # ordering constraint introduced by the chatappdb consolidation; see the
      # healthcheck comment on user-service above for what it prevents.
      user-service:
        condition: service_healthy

volumes:
  mysql-data:
