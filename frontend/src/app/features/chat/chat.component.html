<div class="page chat-page">
  <h1>Chat with {{ recipientLabel }}</h1>

  <div class="messages">
    @for (bubble of bubbles(); track bubble.messageId) {
      <div class="bubble" [class.sent]="bubble.direction === 'sent'" [class.received]="bubble.direction === 'received'">
        <span>{{ bubble.content }}</span>
        <!-- Tick indicator: '…' while waiting for the server's single-tick
             ack, '✓' once single tick arrives (server received it), '✓✓'
             once double tick arrives (the recipient's client confirmed
             delivery — CLAUDE.md 3.1/3.4, build-order step 9). Deliberately
             NOT colored blue for double tick — blue specifically signals a
             READ receipt in the WhatsApp mental model, which is explicitly
             out of scope (CLAUDE.md section 5); this is only "delivered."
             tick-double just gets a bolder weight instead, purely to be
             visually distinguishable from single tick. -->
        @if (bubble.direction === 'sent') {
          <span class="tick" [class.tick-double]="bubble.tickState === 'double'">
            @if (bubble.tickState === 'pending') {
              …
            } @else if (bubble.tickState === 'single') {
              ✓
            } @else {
              ✓✓
            }
          </span>
        }
      </div>
    }
  </div>

  <div class="composer">
    <input
      #messageInput
      type="text"
      placeholder="Type a message…"
      (keyup.enter)="send(messageInput.value); messageInput.value = ''"
    />
    <button (click)="send(messageInput.value); messageInput.value = ''">Send</button>
  </div>
</div>
