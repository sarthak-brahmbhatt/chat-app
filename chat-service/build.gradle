// Gradle build script (Groovy DSL) for chat-service.
//
// See user-service/build.gradle for a fuller explanation of why Gradle + Groovy DSL
// were chosen and how each block maps back to the old pom.xml.
//
// As of build-order step 8, this file DOES declare a MySQL dependency — the first
// one chat-service has ever had. Per CLAUDE.md 3.4/3.6, chat-service's MySQL writes
// go through a Kafka consumer (this step), which is why that dependency wasn't here
// before now. Redis (instance registry + pub/sub) is still absent — that only
// becomes necessary once the service scales beyond a single instance, which is
// still explicitly deferred.

plugins {
    id 'java'

    // Adds `bootJar` (executable fat-jar packaging) and `bootRun` (what IntelliJ's
    // Gradle-aware run configuration invokes when you run the application class).
    id 'org.springframework.boot' version '3.3.4'

    // Pins transitive dependency versions via the Spring Boot 3.3.4 BOM, same role
    // as Maven's spring-boot-starter-parent inheritance.
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.chatapp'
version = '0.0.1-SNAPSHOT'

// Overrides the Jackson version Spring Boot 3.3.4's BOM pins (2.17.x) up to the
// one the OpenAI SDK is built and tested against. Spring Boot's
// dependency-management plugin would otherwise win the conflict and silently
// DOWNGRADE Jackson underneath the SDK, which is the kind of mismatch that
// compiles cleanly and then fails at runtime deep inside response deserialization.
// Spring Boot 3.4 ships 2.18 itself, so this is a small step forward, not a fork.
ext['jackson-bom.version'] = '2.18.9'

// Pins the JDK used to compile/run this module. Using a toolchain (vs. a bare
// sourceCompatibility string) lets Gradle auto-provision JDK 21 if it isn't already
// the machine's default.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Provides the STOMP/raw WebSocket support (SockJS, WebSocketHandler, etc.) that
    // the chat connection layer (Section 3.2/4 of CLAUDE.md) will be built on.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Exposes /actuator/health so we can confirm the service is up in both run
    // contexts (IntelliJ + Docker Compose).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- JWT verification: validates tokens issued by user-service at WebSocket
    // handshake time (CLAUDE.md 3.3, build-order step 5). Same jjwt library and
    // version as user-service, for the same reasoning (see user-service's
    // JwtService class comment) — but chat-service only ever VERIFIES tokens, never
    // issues them, so its own JwtValidator class is deliberately smaller than
    // user-service's JwtService (no generateAccessToken/TTL exposure). This is a
    // small, intentional duplication rather than a shared module — see the
    // explanation given alongside this change for the tradeoff.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // --- Kafka: async message persistence (CLAUDE.md 3.4, build-order step 8) ---
    // spring-kafka wraps the plain Apache Kafka Java client with Spring-idiomatic
    // pieces: KafkaTemplate (used by ChatMessagePublisher to produce) and
    // @KafkaListener (used by ChatMessageConsumer to consume) — the same
    // "annotate a method, Spring wires the plumbing" pattern as @KafkaListener's
    // cousins elsewhere in Spring (@Scheduled, @EventListener, etc.).
    implementation 'org.springframework.kafka:spring-kafka'

    // --- Persistence: the Message DB (messagedb), written by ChatMessageConsumer.
    // Same two dependencies as user-service's User DB access (see
    // user-service/build.gradle for the fuller explanation of each) — this is a
    // completely separate database from userdb, just the same MySQL container/
    // instance, per CLAUDE.md 3.5. ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- DoctorAssistant bot: OpenAI Responses API (CLAUDE.md 3.9, build-order
    // step 18) ---
    // The official OpenAI Java SDK, called directly. Spring AI is deliberately
    // NOT used: it would abstract the provider behind its own model, and this
    // project's stated purpose is hands-on visibility into the mechanics — the
    // same reasoning that chose Kafka over a managed queue (3.4) and EC2+ASG
    // over ECS/Fargate (3.8). The cost of that choice is named in the design's
    // out-of-scope list: swapping to Bedrock later is real rewrite work against
    // SDK-specific classes, not a config change.
    //
    // Brings okhttp and the Kotlin stdlib along transitively — the SDK is
    // written in Kotlin. That is the price of the official client; the
    // alternative is hand-rolling the HTTP calls and the JSON schema generation
    // that makes structured outputs work.
    implementation 'com.openai:openai-java:4.52.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // --- Test scope: @EmbeddedKafka spins up a real, temporary, in-process Kafka
    // broker for a single test run — no Docker required for this specific test.
    // This is what lets KafkaEndToEndTest prove the producer/consumer wiring
    // (topic name, (de)serializers, trusted packages, consumer group) genuinely
    // works, rather than just asserting against mocks of Spring Kafka's own classes.
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    // --- Test scope: an in-memory database for @DataJpaTest ---
    // Added for AvailabilityServiceTest specifically. §4's availability
    // subtraction is a single JPQL query joining three tables, and it is the one
    // piece of this feature where a mock-based test would assert nothing at all:
    // mocking the repository just asserts that the mock returns what it was told
    // to. Running it against a real database engine is what actually proves the
    // entity join, the NOT EXISTS, the enum parameters and the constructor
    // projection do what they claim.
    //
    // H2 rather than Testcontainers/MySQL: this test is about the query's LOGIC,
    // which is plain JPQL with nothing MySQL-specific in it, and H2 keeps
    // `./gradlew test` runnable with no Docker daemon — the same property
    // @EmbeddedKafka already buys the Kafka tests above.
    testRuntimeOnly 'com.h2database:h2'
}

// JUnit 5 (Jupiter) is what spring-boot-starter-test ships; without this line Gradle
// defaults to a JUnit 4 test runner and silently executes zero tests.
tasks.named('test') {
    useJUnitPlatform()
}
