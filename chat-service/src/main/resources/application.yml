spring:
  application:
    name: chat-service

  # --- MySQL connection: chatappdb (CLAUDE.md 3.5, build-order steps 8 and 18) ---
  # Same ${VAR:default} dual-mode pattern as user-service's datasource config:
  # MYSQL_HOST unset (native run) -> localhost:3306, the host port
  # docker-compose.yml publishes MySQL on; MYSQL_HOST=mysql (containerized run,
  # set by docker-compose.yml) -> the mysql container's Docker-DNS name.
  #
  # Step 18 pointed this at `chatappdb` — the SAME database user-service now uses,
  # not merely the same MySQL instance as before. chat-service still owns
  # `messages` and the bot tables, but it can now also READ `users` (see
  # entity/AppUser.java) to tell a BOT recipient from a human one, which is
  # exactly the cross-table reach the old userdb/messagedb split forbade.
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/chatappdb
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  jpa:
    hibernate:
      # Same tradeoff/caveat as user-service: fine while iterating locally with
      # no real data at stake; a real deployment should use versioned migrations
      # (Flyway/Liquibase) instead of letting Hibernate own schema changes.
      ddl-auto: update
    open-in-view: false

  # --- Kafka: async message persistence (CLAUDE.md 3.4, build-order step 8) ---
  kafka:
    # Same dual-mode reasoning as everything else in this file: unset (native run)
    # -> localhost:9092 (Kafka's PLAINTEXT_HOST listener, published to the host by
    # docker-compose.yml); KAFKA_BOOTSTRAP_SERVERS=kafka:19092 (containerized run,
    # set by docker-compose.yml) -> Kafka's PLAINTEXT listener, reachable only from
    # other containers on the Compose network. "Bootstrap" servers are just the
    # initial contact point(s) the client uses to discover the rest of the
    # cluster's metadata — with a single broker here, it's also the only one.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Keys/values are sent as raw bytes on the wire — a serializer is what turns
      # our Java objects into those bytes. String keys (see ChatMessagePublisher's
      # conversation-key) need only the standard StringSerializer; the value is a
      # whole ChatMessageEvent object, serialized as JSON via Spring Kafka's
      # JsonSerializer (backed by the same Jackson already used everywhere else
      # in this project for HTTP/WebSocket JSON).
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # The consumer GROUP this listener belongs to — Kafka tracks "how far has
      # group X read topic Y" per group, and if multiple consumer instances ever
      # share this same group id, Kafka automatically splits the topic's
      # partitions between them (so each message is processed by exactly one
      # instance in the group, not all of them). One instance today, but this id
      # is what a second chat-service instance would need to share to cooperate
      # on consuming rather than each independently re-processing every message.
      group-id: chat-service-message-persister
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # JsonDeserializer refuses to instantiate a class it doesn't explicitly
        # trust, by default — a safety guard against blindly deserializing
        # arbitrary bytes from a topic into arbitrary Java classes. Since
        # producer and consumer are the same codebase here, trusting our own
        # kafka package is exactly as far as this needs to go.
        spring.json.trusted.packages: com.chatapp.chatservice.kafka

# --- JWT verification secret (CLAUDE.md 3.3, build-order step 5) ---
# MUST be byte-identical to user-service's jwt.secret (see
# user-service/src/main/resources/application.yml) — chat-service only VERIFIES
# tokens issued by user-service, never issues its own. If these two values ever
# diverge, every token chat-service receives fails signature verification, and the
# only visible symptom is "every WebSocket connection gets rejected as invalid" —
# nothing points at a secret mismatch specifically, so this is worth remembering.
#
# In Docker Compose, this is enforced structurally: both services read JWT_SECRET
# from the same YAML anchor in docker-compose.yml (&jwt-secret), so there's exactly
# one literal value, not two independently-set ones that happen to match. Running
# natively (IntelliJ, no docker-compose involved), there's no equivalent structural
# guarantee — the default below must be kept byte-for-byte identical to
# user-service's default by hand. If you ever rotate this secret for real, set the
# SAME JWT_SECRET environment variable in both services' native run configuration.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-change-me-before-any-real-deployment}

# --- DoctorAssistant bot / OpenAI Responses API (CLAUDE.md 3.9, build-order
# step 18) ---
# The API key follows the same "never hardcode a secret" rule as jwt.secret above,
# but WITHOUT a usable default: an OpenAI key is a real, billable credential, so
# there is no dev-only placeholder that could sensibly stand in for one. An empty
# value is therefore a legitimate, expected state (nobody has configured a key
# yet) rather than a startup error — DoctorAssistantBotService degrades to a
# fixed apology reply in that case, so the rest of chat-service still runs
# normally. Set it via a gitignored .env file at the repo root; see .env.example.
#
# The model is configurable rather than hardcoded so a later swap stays a config
# change, and so bot_token_usage.model keeps two different models' numbers
# comparable rather than silently mixed (CLAUDE.md 3.9's token-tracking point).
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  # Bounds how long a single WebSocket-triggered turn can block. The bot call runs
  # on the WebSocket's own inbound thread, so an unbounded hang here would pin that
  # thread indefinitely; 60s is generous for a non-streaming reply and still
  # finite. Version 1 has no streaming (CLAUDE.md 3.9 / §7 of the design), so the
  # whole reply lands in one response and this is the only latency knob that matters.
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:60}

bot:
  # The username of the seeded BOT user row (user-service's BotUserSeeder creates
  # it; chat-service only ever reads it). Kept as config rather than a constant in
  # both services so the two cannot drift apart silently — a mismatch would show up
  # as "the bot never answers" with nothing pointing at the cause.
  username: ${BOT_USERNAME:doctorassistant}
  clinic-name: ${BOT_CLINIC_NAME:Super Clinic}
  # How far ahead §6.1's prompt stuffing reaches when injecting existing bookings.
  # Deliberately small: this is Version 1's naive "put everything in the prompt"
  # approach, and the whole point is that this number is what makes token cost
  # grow. Widening it is how you make the scaling problem visible on purpose.
  booking-horizon-days: ${BOT_BOOKING_HORIZON_DAYS:7}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
