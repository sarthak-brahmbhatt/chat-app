<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kafka partitioning by conversation id</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { display: flex; justify-content: center; padding: 24px; }
  svg { width: 100%; max-width: 1100px; height: auto; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
</style>
</head>
<body>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three conversations each hash to a fixed partition. Messages from one conversation always land in the same partition, in order.">
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Conversations -->
  <rect x="45"  y="50" width="230" height="58" rx="6" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="160" y="86" text-anchor="middle" font-size="19" font-weight="600" fill="#1d4ed8">alice-bob</text>

  <rect x="365" y="50" width="230" height="58" rx="6" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <text x="480" y="86" text-anchor="middle" font-size="19" font-weight="600" fill="#c2410c">bob-carol</text>

  <rect x="685" y="50" width="230" height="58" rx="6" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  <text x="800" y="86" text-anchor="middle" font-size="19" font-weight="600" fill="#0f766e">alice-carol</text>

  <!-- Conversation -> hash -->
  <line x1="160" y1="110" x2="398" y2="222" stroke="#4b5563" stroke-width="2" marker-end="url(#gray)"/>
  <line x1="480" y1="110" x2="480" y2="222" stroke="#4b5563" stroke-width="2" marker-end="url(#gray)"/>
  <line x1="800" y1="110" x2="562" y2="222" stroke="#4b5563" stroke-width="2" marker-end="url(#gray)"/>

  <!-- Hash -->
  <rect x="330" y="225" width="300" height="62" rx="6" fill="none" stroke="#4b5563" stroke-width="2.5"/>
  <text x="480" y="263" text-anchor="middle" font-size="18" fill="#111827">hash(conversation id) % 3</text>

  <!-- Hash -> partitions -->
  <line x1="392" y1="289" x2="170" y2="391" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/>
  <line x1="480" y1="289" x2="480" y2="391" stroke="#c2410c" stroke-width="2.5" marker-end="url(#orange)"/>
  <line x1="568" y1="289" x2="790" y2="391" stroke="#0f766e" stroke-width="2.5" marker-end="url(#teal)"/>

  <!-- Partition 0 -->
  <rect x="45" y="395" width="250" height="150" rx="6" fill="none" stroke="#4b5563" stroke-width="2"/>
  <text x="170" y="429" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">partition 0</text>
  <rect x="69"  y="455" width="58" height="46" rx="4" fill="#1d4ed8"/>
  <text x="98"  y="485" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">m1</text>
  <rect x="141" y="455" width="58" height="46" rx="4" fill="#1d4ed8"/>
  <text x="170" y="485" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">m2</text>
  <rect x="213" y="455" width="58" height="46" rx="4" fill="#1d4ed8"/>
  <text x="242" y="485" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">m3</text>

  <!-- Partition 1 -->
  <rect x="355" y="395" width="250" height="150" rx="6" fill="none" stroke="#4b5563" stroke-width="2"/>
  <text x="480" y="429" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">partition 1</text>
  <rect x="379" y="455" width="58" height="46" rx="4" fill="#c2410c"/>
  <text x="408" y="485" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">m1</text>
  <rect x="451" y="455" width="58" height="46" rx="4" fill="#c2410c"/>
  <text x="480" y="485" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">m2</text>
  <rect x="523" y="455" width="58" height="46" rx="4" fill="#c2410c"/>
  <text x="552" y="485" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">m3</text>

  <!-- Partition 2 -->
  <rect x="665" y="395" width="250" height="150" rx="6" fill="none" stroke="#4b5563" stroke-width="2"/>
  <text x="790" y="429" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">partition 2</text>
  <rect x="689" y="455" width="58" height="46" rx="4" fill="#0f766e"/>
  <text x="718" y="485" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">m1</text>
  <rect x="761" y="455" width="58" height="46" rx="4" fill="#0f766e"/>
  <text x="790" y="485" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">m2</text>
  <rect x="833" y="455" width="58" height="46" rx="4" fill="#0f766e"/>
  <text x="862" y="485" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">m3</text>

  <!-- Footnote -->
  <text x="480" y="596" text-anchor="middle" font-size="16" fill="#4b5563">Order guaranteed within a partition. No order promised across partitions —</text>
  <text x="480" y="620" text-anchor="middle" font-size="16" fill="#4b5563">and no user can observe cross-conversation order.</text>
</svg>
</body>
</html>
